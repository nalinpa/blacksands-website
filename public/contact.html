<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Black Sands</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/style.css">

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg height='48' viewBox='0 0 24 24' width='48' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3CclipPath id='dune-clip'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3C/clipPath%3E%3Cg clip-path='url(%23dune-clip)' fill='%230F172A'%3E%3Cpath d='M0 0 L 24 0 L 24 12 C 20 9, 17 6, 13 6 C 9 6, 4 11, 0 14 Z'/%3E%3Cpath d='M0 24 L 24 24 L 24 16 C 21 12, 18 9.5, 15 9.5 C 10 9.5, 5 14, 0 18 Z'/%3E%3C/g%3E%3C/svg%3E">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.15.12/dist/cdn.min.js" integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L" crossorigin="anonymous"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>

    <div class="global-canvas"></div>

    <div x-data="{ navHtml: '' }"
        x-init="fetch('/components/navbar.html').then(r => r.text()).then(html => navHtml = html).catch(() => {})"
        x-html="navHtml">
    </div>


    <main class="login-container">

        <div class="login-box access-box">

            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 6L12 13L2 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <h1>Get in touch</h1>
            <p>For new projects, partnership enquiries or anything else, email us directly and we'll get back to you.</p>

            <a href="mailto:info@blacksands.app" class="btn btn-primary">info@blacksands.app</a>
            <a href="/" class="btn btn-secondary">Return Home</a>

        </div>

    </main>

    <div x-data="{ footerHtml: '' }"
        x-init="fetch('/components/footer.html').then(r => r.text()).then(html => footerHtml = html).catch(() => {})"
        x-html="footerHtml">
    </div>

</body>
</html>
